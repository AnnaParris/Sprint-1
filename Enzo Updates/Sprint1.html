<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radio Map Wireframe</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>
    <script src="stations.js" defer></script>
    <script src="sprint1.js" defer></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

    <div class="container">

        <div class="topbar">
            <div>
            <img id="logo" src="P48_Logo.png" alt="logo"></div>
            <div class="title">USA Radio Map</div>
            <input class="search" type="text" placeholder="Search">
        </div>
        <div class="main">
            <div id="map"></div>
        </div>

        <div class="sidebar">
            <div class="scroll-box">
                <img id="tuner" src="tuner.jpg">

            </div>

            <select id="dropdown" class="state">
                <option value="">-- State --</option>
            </select>

            <select id="city_select" class="cities">
                <option value="">-- Select City --</option>
            </select>

            <div class="list">
             <ul id="stationList">
            </ul>
            </div>
        </div>

    </div>

</body>
</html>
