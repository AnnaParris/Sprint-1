<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Radio Map Wireframe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

    <header>
        <div>
            <img id="logo" src="P48_Logo.png" alt="logo">
        </div>

        <h1>USA Radio Map</h1>

        <div>
            <input type="text" placeholder="Search">
        </div>
    </header>

    <hr>

    <main>
        <section>
            <div>
                <div id="map" style="width: 100%; height: 800px;"></div>
            </div>

            <div>
                <p id="description">Descrip</p>
            </div>

            <div>
                <!--<p>Angela Brown | Enzo Collin | Edwin Colmenares | Elizabeth Parrott</p>-->
            </div>

            <footer>
                <span>Advertize</span>
                <img src="" alt="adv-icon" width="20">
                <span>Advertize</span>
            </footer>
        </section>

        <aside>
            <div>
                <button>Scroll</button>

            </div>

            <div>
                <select id="dropdown" name="state">
                    <option value="">State</option>


                </select>
            </div>

            <ul id="stationList">
                <li>
                    <input type="checkbox" id="myCheckbox">
                    <label for="myCheckbox">Check me!</label>
                </li>
            </ul>
        </aside>
    </main>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="sprint1.js"></script>
</body>

</html>
